<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TRACE OS</title><link rel="stylesheet" href="style.css?v=15"></head><body><section id="identityScreen" style="position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;background:#071016;color:#dce8ee;font-family:system-ui,sans-serif;padding:24px;box-sizing:border-box"><div style="width:min(420px,100%);text-align:center"><div style="font-size:42px;font-weight:800;letter-spacing:.12em">TRACE</div><div style="font-size:13px;letter-spacing:.22em;color:#8ea5af;margin-top:2px">TRACE OS</div><div style="margin-top:42px;font-size:18px">Before we begin...</div><div style="margin-top:10px;color:#9daeb6">What should we call you?</div><input id="playerName" maxlength="24" autocomplete="off" spellcheck="false" style="display:block;width:100%;box-sizing:border-box;margin-top:18px;padding:13px 14px;border-radius:9px;border:1px solid #31434c;background:#0c151b;color:#fff;font:inherit;outline:none"><button id="identityContinue" class="win-btn" style="margin-top:12px;width:100%;min-height:44px">CONTINUE</button></div></section><div id="boot"><div class="boot-logo">TRACE</div><div class="boot-sub">TRACE OS</div><div id="bootStatus">Starting system...</div></div><main id="desktop" class="hidden"><div id="desktopIcons"><button class="desktop-icon" data-app="files">📁<b>Files</b></button><button class="desktop-icon" data-app="notes">📝<b>Notes</b></button><button class="desktop-icon" data-app="calculator">🧮<b>Calculator</b></button><button class="desktop-icon" data-app="browser">🌐<b>Browser</b></button><button class="desktop-icon" data-app="settings">⚙️<b>Settings</b></button><button class="desktop-icon" data-app="trash">🗑️<b>Trash</b></button><button class="desktop-icon" data-app="grid">🎮<b>TRACE: RUN</b></button></div><section id="windows"></section><div id="notifications"></div><footer id="taskbar"><button id="startButton">◉</button><div id="taskApps"></div><div class="task-spacer"></div><button id="searchButton">⌕</button><div id="clock">00:00</div></footer><div id="startMenu" class="panel hidden"><b>TRACE OS</b><input id="startSearch" placeholder="Search TRACE..."><div id="startResults"></div><small>System ready.</small></div></main><script>(function(){function showTraceError(message,source,line,col,type){let box=document.getElementById("traceError");if(!box){box=document.createElement("div");box.id="traceError";box.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#24171a;border:1px solid #a85b66;color:#fff;border-radius:10px;padding:14px;font:13px system-ui;box-shadow:0 12px 40px #000c";document.body.appendChild(box)}let label=type==="game"?"⚠️ TRACE OS detected a game problem":"⚠️ TRACE OS error";box.innerHTML="<b>"+label+"</b><div style='margin-top:7px;color:#ffb8c0'>"+String(message).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})+"</div>"+(source?("<small style='display:block;margin-top:7px;color:#c9aeb3'>"+source+(line?":"+line:"")+(col?":"+col:"")+"</small>"):"")}window.onerror=function(message,source,line,col){showTraceError(message,source,line,col);return false};window.addEventListener("unhandledrejection",function(e){showTraceError("Unhandled promise error: "+(e.reason&&e.reason.message?e.reason.message:e.reason))});window.traceGameError=function(message,details){showTraceError(message,details||"Game state",null,null,"game")};window.addEventListener("trace-game-error",function(e){showTraceError(e.detail&&e.detail.message?e.detail.message:"An unexpected game state was detected.",e.detail&&e.detail.details?e.detail.details:"Game state",null,null,"game")})})();</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="trace-save.js?v=1"></script><script src="story.js?v=3"></script><script src="maya.js?v=1"></script><script src="app.js?v=39"></script></body></html>
