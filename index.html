<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TRACE OS</title><link rel="stylesheet" href="style.css?v=15"></head><body><div id="boot"><div class="boot-logo">TRACE</div><div class="boot-sub">TRACE OS</div><div id="bootStatus">Starting system...</div></div><main id="desktop" class="hidden"><div id="desktopIcons"><button class="desktop-icon" data-app="files">📁<b>Files</b></button><button class="desktop-icon" data-app="notes">📝<b>Notes</b></button><button class="desktop-icon" data-app="calculator">🧮<b>Calculator</b></button><button class="desktop-icon" data-app="browser">🌐<b>Browser</b></button><button class="desktop-icon" data-app="settings">⚙️<b>Settings</b></button><button class="desktop-icon" data-app="trash">🗑️<b>Trash</b></button><button class="desktop-icon" data-app="grid">🎮<b>TRACE: RUN</b></button></div><section id="windows"></section><div id="notifications"></div><footer id="taskbar"><button id="startButton">◉</button><div id="taskApps"></div><div class="task-spacer"></div><button id="searchButton">⌕</button><div id="clock">00:00</div></footer><div id="startMenu" class="panel hidden"><b>TRACE OS</b><input id="startSearch" placeholder="Search TRACE..."><div id="startResults"></div><small>System ready.</small></div></main><script>(function(){function showTraceError(message,source,line,col){let box=document.getElementById("traceError");if(!box){box=document.createElement("div");box.id="traceError";box.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#24171a;border:1px solid #a85b66;color:#fff;border-radius:10px;padding:14px;font:13px system-ui;box-shadow:0 12px 40px #000c";document.body.appendChild(box)}box.innerHTML="<b>⚠️ TRACE OS error</b><div style='margin-top:7px;color:#ffb8c0'>"+String(message).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})+"</div>"+(source?("<small style='display:block;margin-top:7px;color:#c9aeb3'>"+source+(line?":"+line:"")+(col?":"+col:"")+"</small>"):"")}window.onerror=function(message,source,line,col){showTraceError(message,source,line,col);return false};window.addEventListener("unhandledrejection",function(e){showTraceError("Unhandled promise error: "+(e.reason&&e.reason.message?e.reason.message:e.reason))})})();</script><script src="app.js?v=30"></script></body></html>
