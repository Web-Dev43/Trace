<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRACE DEVKIT</title><style>body{font-family:system-ui;background:#071016;color:#dce8ee;margin:0;padding:20px}main{max-width:900px;margin:auto}.card{background:#0c151b;border:1px solid #263944;border-radius:12px;padding:16px;margin:12px 0}button,input,select,textarea{font:inherit}button{padding:10px 14px;border:1px solid #415762;background:#14232b;color:#fff;border-radius:8px;cursor:pointer;margin:4px}input,select,textarea{background:#081218;color:#fff;border:1px solid #31434c;border-radius:7px;padding:10px;box-sizing:border-box}textarea{width:100%;min-height:150px;font-family:monospace}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.muted{color:#8ea5af;font-size:13px}.ok{color:#a9d6b4}</style></head><body><main><h1>TRACE DEVKIT</h1><p class="muted">A small builder/debugger for TRACE-style story events. Build the logic here, then copy the generated event code into a project.</p><section class="card"><h2>Quick Event Builder</h2><div class="grid"><label>Event ID<input id="id" value="archive_found"></label><label>Trigger<select id="trigger"><option>After time</option><option>On app open</option><option>On file discovered</option><option>On clue count</option><option>Manual</option></select></label><label>Minutes<input id="minutes" type="number" min="0" max="120" value="3"></label><label>App<select id="app"><option>Files</option><option>Browser</option><option>TRACE: RUN</option><option>Notes</option><option>Calculator</option><option>System</option></select></label></div><p><label>Notification<input id="note" style="width:100%" value="A new archived record is available."></label></p><p><label>Player clue<input id="clue" style="width:100%" value="The archive references an unresolved user record."></label></p><button id="generate">Generate Event</button></section><section class="card"><h2>Generated Code</h2><textarea id="out" spellcheck="false"></textarea><button id="copy">Select code</button></section><section class="card"><h2>Story Checklist</h2><div id="list"></div></section><p id="status" class="muted"></p></main><script>(function(){const $=id=>document.getElementById(id);const defaults=[["identity","Player enters a name"],["unease","First anomaly"],["archive","Archive clue"],["record","Sibling record clue"],["maya","Maya contact"],["reveal","Identity reveal"]];function render(){ $("list").innerHTML=defaults.map(x=>"<div class='card'><b>"+x[0].toUpperCase()+"</b><div class='muted'>"+x[1]+"</div></div>").join("")}function gen(){const id=$("id").value.trim().replace(/[^a-z0-9_]/gi,"_")||"new_event";const min=Math.max(0,Math.min(120,Number($("minutes").value)||0));const trigger=$("trigger").value;const app=$("app").value;const note=$("note").value.trim();const clue=$("clue").value.trim();$("out").value='story.event("'+id+'",{\n  trigger:"'+trigger+'",\n  afterMinutes:'+min+',\n  app:"'+app+'",\n  notification:"'+note.replace(/"/g,'\\\"')+'",\n  clue:"'+clue.replace(/"/g,'\\\"')+'"\n});';$("status").textContent="Event generated. This builder does not modify TRACE automatically.";}$("generate").onclick=gen;$("copy").onclick=()=>{$("out").focus();$("out").select();$("status").textContent="Code selected. Copy it with the browser copy command.";};render();gen()})();</script></body></html>
